FetchReachDense-v4:
  n_timesteps: 300000
  policy: MultiInputPolicy
  learning_rate: 0.001
  batch_size: 256
  buffer_size: 1000000
  learning_starts: 5000
  train_freq: 1
  gradient_steps: 1
  gamma: 0.98
  tau: 0.02
  policy_kwargs: dict(net_arch=[256, 256])
  replay_buffer_class: HerReplayBuffer
  replay_buffer_kwargs:
    n_sampled_goal: 4
    goal_selection_strategy: future
